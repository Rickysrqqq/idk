<!doctype html><meta charset="utf-8"><script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFExporter} from 'three/addons/GLTFExporter.js';
import {loadOutline,buildBracket} from './lib/bracket.js';
const o=await loadOutline();
const tl=new THREE.TextureLoader();
const ld=u=>new Promise(r=>tl.load(u,t=>{t.colorSpace=THREE.SRGBColorSpace;r(t)}));
const mk=async(u,a,n)=>{const m=buildBracket(o,await ld(u),{anod:a});m.scale.setScalar(100);m.name=n;return m};
window.exportGLB=async(which)=>{
  const m=which==='silver'?await mk('assets/br_silver.png',0xaab0bb,'Exzmoto_Bracket_Silver'):await mk('assets/br_black.png',0x0b0b0e,'Exzmoto_Bracket_Black');
  const buf=await new GLTFExporter().parseAsync(m,{binary:true});
  const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s);
};
window.ready=true;
</script>
